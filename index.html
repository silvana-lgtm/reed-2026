<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobertura Reed Latino 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1B34; --surface:#14264A; --ink:#F3F6FB; --muted:#A8B4C9; --line:#27406B;
  --gold:#34D399; --gold-soft:#123A45; --done:#34D399; --doing:#F2C94C; --todo:#7F8DA6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B34; --surface:#14264A; --ink:#F3F6FB; --muted:#A8B4C9; --line:#27406B;
  --gold:#34D399; --gold-soft:#123A45; --done:#34D399; --doing:#F2C94C; --todo:#7F8DA6;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B34; --surface:#14264A; --ink:#F3F6FB; --muted:#A8B4C9; --line:#27406B;
  --gold:#34D399; --gold-soft:#123A45; --done:#34D399; --doing:#F2C94C; --todo:#7F8DA6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}
h1,h2,.num{font-family:Marcellus,Georgia,"Times New Roman",serif;font-weight:400}
header{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;padding-bottom:22px;border-bottom:2px solid var(--gold)}
h1{font-size:clamp(48px,9vw,104px);line-height:.95;margin:0 0 14px;letter-spacing:-.01em}
h1 .g{color:var(--gold)}
h1 .w{color:#FFFFFF}
.sub{color:var(--muted);margin:0}
.count{text-align:right}
.count .num{font-size:clamp(140px,24vw,280px);line-height:.8;color:#FFFFFF}
.count small{font-size:16px}
.count small{display:block;color:var(--gold);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:22px 0 26px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.phase{appearance:none;border:0;border-right:1px solid var(--line);background:none;color:var(--ink);padding:14px 16px;text-align:left;cursor:pointer;font:inherit}
.phase:last-child{border-right:0}
.phase b{display:block;font-weight:600}
.phase span{font-size:13px;color:var(--muted)}
.phase .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.phase[aria-pressed="true"]{background:var(--gold-soft)}
.phase:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.9fr) minmax(260px,1fr);gap:28px;align-items:start}
.group{margin-bottom:22px}
.group-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px}
.group-h small{font-weight:500;color:var(--muted);margin-left:auto}
.group-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.group[data-p="urgente"]{--pc:#F87171}
.group[data-p="importante"]{--pc:#F2C94C}
.group[data-p="menor"]{--pc:#7F8DA6}
.group-h{background:color-mix(in srgb,var(--pc) 16%,transparent)}
.task{border-left:3px solid var(--pc,transparent);padding-left:12px}
.meta .prio{font-weight:600}
.done-panel h2 .hint{font-size:13px}
.done-item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.done-item b{font-weight:500;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
.done-item small{grid-column:2;font-size:12px;color:var(--muted)}
.done-item .status{width:20px;height:20px;margin-top:2px}
h2{font-size:24px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 .hint{font:13px Figtree,system-ui,sans-serif;color:var(--muted)}
.task{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0 12px 12px;border-bottom:1px solid var(--line)}
.status{appearance:none;border:1.5px solid var(--todo);background:none;width:22px;height:22px;border-radius:50%;margin-top:4px;cursor:pointer;padding:0;position:relative}
.status[data-s="doing"]{border-color:var(--doing);background:linear-gradient(90deg,var(--doing) 50%,transparent 50%)}
.status[data-s="done"]{border-color:var(--done);background:var(--done)}
.status[data-s="done"]::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.t-title{font:inherit;font-weight:500;color:inherit;background:none;border:0;border-bottom:1px dashed transparent;padding:2px 0;width:100%}
.t-title:hover,.t-title:focus{border-bottom-color:var(--line);outline:none}
.task.is-done .t-title{color:var(--muted);text-decoration:line-through}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.meta select,.meta input[type=date]{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px}
.meta select:hover,.meta input[type=date]:hover,.meta select:focus,.meta input[type=date]:focus{border-color:var(--line);outline:none}
.fields{grid-column:2;display:grid;grid-template-columns:minmax(140px,1fr) 2fr;gap:8px;margin-top:6px}
.fields label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.fields input,.fields textarea{font:14px/1.45 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.fields textarea{resize:vertical;min-height:36px}
.fields input:focus,.fields textarea:focus{border-color:var(--gold);outline:none}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;padding:2px 6px;border-radius:6px}
.del:hover{color:#B3412F}
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-top:14px}
.add input,.add select,.logform textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.logform{display:grid;gap:8px;margin-bottom:14px}
.logform textarea{min-height:70px;resize:vertical}
.logform .row{display:flex;gap:8px}
.logform select{flex:1;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.entry{padding:10px 0;border-top:1px solid var(--line)}
.entry time{font-size:12px;color:var(--gold);font-weight:600}
.entry .tag{font-size:12px;color:var(--muted);margin-left:6px}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.entry .del{float:right}
.empty{color:var(--muted);padding:16px 0;margin:0}
.ideas{margin-top:40px;padding-top:24px;border-top:2px solid var(--gold)}
.ideaform{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr auto;gap:8px;margin-bottom:18px}
.ideaform input,.ideaform select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.idea p{margin:0;white-space:pre-wrap;font-size:15px}
.idea a{color:var(--gold);font-size:13px;font-weight:600;word-break:break-all}
.idea small{color:var(--muted);font-size:12px}
.idea .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.idea .acts button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.idea .acts button:hover{border-color:var(--gold)}
.idea .acts .del{border:0;margin-left:auto}
@media (max-width:820px){.ideaform{grid-template-columns:1fr 1fr}.ideaform input:first-child,.ideaform input:nth-child(2){grid-column:1/-1}}
.linkbtn{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--gold);border-radius:6px;padding:3px 10px;cursor:pointer;margin-left:6px;display:inline-block}
.state{font-size:13px;color:var(--muted);margin-top:24px}
@media (max-width:1080px){
  .grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .done-panel{grid-column:1/-1;order:3}
}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .tasks-col{order:1}.done-panel{order:2}.log-panel{order:3}
  .phases{grid-template-columns:repeat(2,1fr)}
  .phase:nth-child(2){border-right:0}
  .phase:nth-child(-n+2){border-bottom:1px solid var(--line)}
  header{grid-template-columns:1fr}
  .count{text-align:left}
  .add{grid-template-columns:1fr 1fr}
  .add input{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.phase .bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="g">Cobertura Reed Latino</span> <span class="w">2026</span></h1>
      <p class="sub">Poligrama en Panamá. Premiación el 6 de noviembre, 15 aniversario.</p>
    </div>
    <div class="count"><div class="num" id="days">–</div><small id="daysLabel">días para la premiación</small></div>
  </header>

  <nav class="phases" id="phases" aria-label="Filtrar por fase"></nav>

  <div class="grid">
    <aside class="done-panel">
      <h2>Terminadas <span class="hint" id="doneCount"></span></h2>
      <div id="done"></div>
    </aside>

    <section class="tasks-col">
      <h2>Tareas <span class="hint" id="filterHint">Todas las fases</span></h2>
      <div id="tasks"></div>
      <div class="add">
        <input id="newTitle" placeholder="Nueva tarea, por ejemplo: brief para el camarógrafo" aria-label="Nueva tarea">
        <select id="newPhase" aria-label="Fase"></select>
        <select id="newPrio" aria-label="Importancia"><option value="urgente">Urgente</option><option value="importante" selected>Importante</option><option value="menor">Menos importante</option></select>
        <button class="btn" id="addBtn">Agregar tarea</button>
      </div>
    </section>

    <aside class="log-panel">
      <h2>Bitácora</h2>
      <div class="logform">
        <textarea id="logText" placeholder="¿Qué avanzaste hoy? Ej.: Hablé con Fer, confirma camarógrafo en Panamá."></textarea>
        <div class="row">
          <select id="logPhase" aria-label="Fase de la nota"></select>
          <button class="btn" id="logBtn">Guardar nota</button>
        </div>
      </div>
      <div id="log"></div>
    </aside>
  </div>
  <section class="ideas">
    <h2>Ideas para posts <span class="hint">Anota ideas y links de referencia</span></h2>
    <div class="ideaform">
      <input id="ideaText" placeholder="Idea, por ejemplo: carrusel de premios de años anteriores" aria-label="Idea">
      <input id="ideaLink" type="url" placeholder="Link de referencia (opcional)" aria-label="Link de referencia">
      <input id="ideaBy" placeholder="Quién la propone" aria-label="Quién la propone">
      <select id="ideaPhase" aria-label="Fase de la idea"></select>
      <button class="btn" id="ideaBtn">Agregar idea</button>
    </div>
    <div class="idea-grid" id="ideas"></div>
  </section>

  <p class="state" id="state">Cargando…</p>
</div>

<script>
const PHASES = [
  {id:"antes", name:"Antes", desc:"Octubre"},
  {id:"coctel", name:"Cóctel", desc:"Concepto Gatsby"},
  {id:"premiacion", name:"Premiación", desc:"6 de noviembre"},
  {id:"despues", name:"Después", desc:"7 nov en adelante"}
];
const STATUS_ORDER = ["todo","doing","done"];
const PRIOS = [
  {id:"urgente", name:"Urgente", desc:"Demasiada importancia"},
  {id:"importante", name:"Importante", desc:"Mucha importancia"},
  {id:"menor", name:"Menos importante", desc:"Puede esperar"}
];
const prioOf = t => PRIOS.some(p => p.id === t.priority) ? t.priority : "importante";
const STATUS_LABEL = {todo:"Pendiente", doing:"En curso", done:"Listo"};
const EVENT = new Date("2026-11-06T19:00:00-05:00");

let tasks = [], log = [], ideas = [], filter = null, store = null;
const $ = id => document.getElementById(id);

// Countdown
(function(){
  const d = Math.ceil((EVENT - new Date()) / 86400000);
  if (d > 0) { $("days").textContent = d; $("daysLabel").textContent = d === 1 ? "día para la premiación" : "días para la premiación"; }
  else if (d === 0) { $("days").textContent = "Hoy"; $("daysLabel").textContent = "es la premiación"; }
  else { $("days").textContent = "✓"; $("daysLabel").textContent = "Premiación realizada"; }
})();

// Selects
for (const sel of [$("newPhase"), $("logPhase"), $("ideaPhase")]) {
  if (sel.id !== "newPhase") sel.innerHTML = '<option value="">General</option>';
  PHASES.forEach(p => sel.insertAdjacentHTML("beforeend", `<option value="${p.id}">${p.name}</option>`));
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderPhases(){
  $("phases").innerHTML = PHASES.map(p => {
    const list = tasks.filter(t => t.phase === p.id);
    const done = list.filter(t => t.status === "done").length;
    const pct = list.length ? Math.round(done / list.length * 100) : 0;
    return `<button class="phase" data-p="${p.id}" aria-pressed="${filter === p.id}">
      <b>${p.name}</b><span>${p.desc} · ${done}/${list.length} listas</span>
      <div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join("");
  $("filterHint").textContent = filter ? PHASES.find(p => p.id === filter).name : "Todas las fases";
}

function taskHTML(t){
  const st = t.status || "todo";
  return `
    <div class="task" data-id="${t.id}">
      <button class="status" data-s="${st}" data-act="status" title="${STATUS_LABEL[st]} (clic para cambiar)" aria-label="Estado: ${STATUS_LABEL[st]}"></button>
      <input class="t-title" data-f="title" value="${esc(t.title)}" aria-label="Tarea">
      <div class="meta">
        <select class="prio" data-f="priority" aria-label="Importancia">${PRIOS.map(p => `<option value="${p.id}" ${p.id===prioOf(t)?"selected":""}>${p.name}</option>`).join("")}</select>
        <select data-f="phase" aria-label="Fase">${PHASES.map(p => `<option value="${p.id}" ${p.id===t.phase?"selected":""}>${p.name}</option>`).join("")}</select>
        <input type="date" data-f="due" value="${esc(t.due)}" aria-label="Fecha">
        <span>${STATUS_LABEL[st]}</span>
        <button class="del" data-act="del">Eliminar</button>
      </div>
      <div class="fields">
        <label>Quién lo hace<input data-f="owner" value="${esc(t.owner)}" placeholder="Nombre"></label>
        <label>Notas<textarea data-f="notes" rows="2" placeholder="Agrega detalles, pendientes o links">${esc(t.notes)}</textarea></label>
      </div>
    </div>`;
}
const byPhase = (a,b) => PHASES.findIndex(p=>p.id===a.phase) - PHASES.findIndex(p=>p.id===b.phase) || (a.order||0) - (b.order||0);
function renderTasks(){
  const list = tasks.filter(t => (!filter || t.phase === filter) && t.status !== "done").sort(byPhase);
  if (!list.length) { $("tasks").innerHTML = '<p class="empty">No hay tareas pendientes aquí. Agrega una abajo.</p>'; return; }
  $("tasks").innerHTML = PRIOS.map(p => {
    const g = list.filter(t => prioOf(t) === p.id);
    if (!g.length) return "";
    return `<div class="group" data-p="${p.id}"><div class="group-h">${p.name}<small>${p.desc} · ${g.length}</small></div>${g.map(taskHTML).join("")}</div>`;
  }).join("");
}
function renderDone(){
  const list = tasks.filter(t => (!filter || t.phase === filter) && t.status === "done").sort(byPhase);
  $("doneCount").textContent = list.length ? list.length + (list.length === 1 ? " tarea" : " tareas") : "";
  if (!list.length) { $("done").innerHTML = '<p class="empty">Cuando termines una tarea aparecerá aquí.</p>'; return; }
  $("done").innerHTML = list.map(t => {
    const ph = PHASES.find(p => p.id === t.phase);
    return `<div class="done-item" data-id="${t.id}">
      <button class="status" data-s="done" data-act="reopen" title="Volver a pendientes" aria-label="Volver a pendientes"></button>
      <b>${esc(t.title)}</b><small>${ph ? ph.name : ""}${t.owner ? " · " + esc(t.owner) : ""}</small></div>`;
  }).join("");
}

function renderLog(){
  const list = [...log].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  if (!list.length) { $("log").innerHTML = '<p class="empty">Aún no hay notas. Escribe lo que vayas avanzando.</p>'; return; }
  $("log").innerHTML = list.map(e => {
    const d = new Date(e.date);
    const when = isNaN(d) ? "" : d.toLocaleDateString("es-MX", {day:"numeric", month:"short"}) + ", " + d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
    const ph = PHASES.find(p => p.id === e.phase);
    return `<div class="entry" data-id="${e.id}"><button class="del" data-act="dellog" aria-label="Eliminar nota">×</button>
      <time>${when}</time>${ph ? `<span class="tag">${ph.name}</span>` : ""}<p>${esc(e.text)}</p></div>`;
  }).join("");
}

function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch(e){ return ""; } }
function renderIdeas(){
  const list = ideas.filter(i => !filter || !i.phase || i.phase === filter).sort((a,b) => (b.date||"").localeCompare(a.date||""));
  if (!list.length) { $("ideas").innerHTML = '<p class="empty">Todavía no hay ideas. Escribe la primera arriba.</p>'; return; }
  $("ideas").innerHTML = list.map(i => {
    const url = safeUrl(i.link); const ph = PHASES.find(p => p.id === i.phase);
    return `<div class="idea" data-id="${i.id}">
      <p>${esc(i.text)}</p>
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ver referencia</a>` : ""}
      <small>${[i.by ? "Propuso " + esc(i.by) : "", ph ? ph.name : ""].filter(Boolean).join(" · ")}</small>
      <div class="acts"><button data-act="totask">Convertir en tarea</button><button class="del" data-act="delidea">Eliminar</button></div>
    </div>`;
  }).join("");
}
function renderAll(){ renderPhases(); renderTasks(); renderDone(); renderLog(); renderIdeas(); }

// ---------- Storage: shared db, fallback to this browser ----------
const LS_KEY = "reed-tracker-v1";
const SEED = {"tasks": [{"due": "", "notes": "", "order": 1, "owner": "Jesss", "phase": "antes", "status": "todo", "title": "Publicaciones de Jesss", "id": "a1"}, {"due": "", "notes": "", "order": 2, "owner": "", "phase": "antes", "status": "todo", "title": "Anuncio de nominaciones (post o carrusel por categoría)", "id": "a2"}, {"due": "2026-10-02", "notes": "Planear todas las salidas de Poligrama y alternas", "order": 3, "owner": "Equipo", "phase": "antes", "status": "todo", "title": "Cerrar ideas de octubre en la junta del viernes", "id": "a3"}, {"due": "", "notes": "", "order": 4, "owner": "Jefes", "phase": "antes", "status": "todo", "title": "Aprobar camarógrafo de Fer en Panamá", "id": "a4"}, {"due": "", "notes": "Con huecos para categorías y número de premios", "order": 5, "owner": "", "phase": "antes", "status": "todo", "title": "Redactar y aprobar boletín base", "id": "a5"}, {"due": "", "notes": "", "order": 6, "owner": "", "phase": "antes", "status": "todo", "title": "Armar lista de medios y socios para el envío", "id": "a6"}, {"due": "", "notes": "", "order": 7, "owner": "", "phase": "antes", "status": "todo", "title": "Diseñar plantilla \"Ganamos X premios\"", "id": "a7"}, {"due": "", "notes": "", "order": 8, "owner": "", "phase": "antes", "status": "todo", "title": "Averiguar si habrá algo especial por el 15 aniversario", "id": "a8"}, {"due": "", "notes": "Para sus perfiles personales, look Gatsby", "order": 1, "owner": "", "phase": "coctel", "status": "todo", "title": "Fotos individuales de Gaby, Héctor y Pato", "id": "c1"}, {"due": "", "notes": "", "order": 2, "owner": "", "phase": "coctel", "status": "todo", "title": "Foto grupal \"Reed Latino 2026\" para Poligrama", "id": "c2"}, {"due": "", "notes": "", "order": 3, "owner": "", "phase": "coctel", "status": "todo", "title": "Definir estilo de edición Gatsby para las fotos", "id": "c3"}, {"due": "2026-11-07", "notes": "", "order": 1, "owner": "", "phase": "despues", "status": "done", "title": "Publicar \"Ganamos X premios\" (mañana)", "id": "d1"}, {"due": "2026-11-07", "notes": "Definir si el material pasa por Fer o directo a Rigo", "order": 2, "owner": "Rigo", "phase": "despues", "status": "todo", "title": "Editar y publicar video del discurso (noche)", "id": "d2"}, {"due": "", "notes": "", "order": 3, "owner": "", "phase": "despues", "status": "todo", "title": "Edit tipo celebridad o vlog del viaje", "id": "d3"}, {"due": "", "notes": "¿Micrófono a los jefes o audio del evento?", "order": 1, "owner": "", "phase": "premiacion", "status": "todo", "title": "Brief de tomas para el camarógrafo", "id": "p1"}, {"due": "2026-11-06", "notes": "", "order": 2, "owner": "Camarógrafo de Fer", "phase": "premiacion", "status": "todo", "title": "Grabar speech en escenario", "id": "p2"}, {"due": "2026-11-06", "notes": "", "order": 3, "owner": "", "phase": "premiacion", "status": "todo", "title": "Fotos de red carpet y cena", "id": "p3"}, {"due": "2026-11-06", "notes": "A medios y a socios, con banco de fotos", "order": 4, "owner": "", "phase": "premiacion", "status": "todo", "title": "Completar y enviar boletín esa noche", "id": "p4"}], "log": [], "ideas": []};
const local = {
  load(){ try { const raw = localStorage.getItem(LS_KEY); const v = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED)); tasks = v.tasks || []; log = v.log || []; ideas = v.ideas || []; } catch(e){ tasks = SEED.tasks.map(t => ({...t})); } renderAll(); },
  save(){ try { localStorage.setItem(LS_KEY, JSON.stringify({tasks, log, ideas})); } catch(e){} },
  async put(col, id, data){ const arr = col === "tasks" ? tasks : col === "ideas" ? ideas : log; const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = {...arr[i], ...data, id}; else arr.push({...data, id}); this.save(); renderAll(); },
  async remove(col, id){ if (col === "tasks") tasks = tasks.filter(x => x.id !== id); else if (col === "ideas") ideas = ideas.filter(x => x.id !== id); else log = log.filter(x => x.id !== id); this.save(); renderAll(); }
};
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function init(){
  store = local; local.load();
  $("state").innerHTML = 'Se guarda en este navegador. <button class="linkbtn" id="expBtn">Exportar respaldo</button> <label class="linkbtn">Importar respaldo<input type="file" id="impFile" accept="application/json" hidden></label>';
  $("expBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({tasks, log, ideas}, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "reed-respaldo-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("impFile").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const v = JSON.parse(await f.text());
      if (!Array.isArray(v.tasks)) throw new Error();
      if (!confirm("Esto reemplaza lo que tienes en este navegador. ¿Continuar?")) return;
      tasks = v.tasks; log = v.log || []; ideas = v.ideas || []; local.save(); renderAll();
    } catch(err) { alert("Ese archivo no es un respaldo válido."); }
    e.target.value = "";
  });
}

// ---------- Events ----------
$("phases").addEventListener("click", e => {
  const b = e.target.closest(".phase"); if (!b) return;
  filter = filter === b.dataset.p ? null : b.dataset.p; renderPhases(); renderTasks(); renderDone(); renderIdeas();
});
$("addBtn").addEventListener("click", addTask);
$("newTitle").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
function addTask(){
  const title = $("newTitle").value.trim(); if (!title || !store) return;
  const phase = $("newPhase").value;
  const order = Math.max(0, ...tasks.filter(t => t.phase === phase).map(t => t.order || 0)) + 1;
  store.put("tasks", newId(), {title, phase, priority: $("newPrio").value, owner:"", due:"", status:"todo", notes:"", order});
  $("newTitle").value = ""; $("newTitle").focus();
}
$("logBtn").addEventListener("click", () => {
  const text = $("logText").value.trim(); if (!text || !store) return;
  store.put("log", newId(), {text, phase: $("logPhase").value, date: new Date().toISOString()});
  $("logText").value = "";
});
$("tasks").addEventListener("click", e => {
  const row = e.target.closest(".task"); if (!row || !store) return;
  const t = tasks.find(x => x.id === row.dataset.id); if (!t) return;
  const act = e.target.dataset.act;
  if (act === "status") { const next = STATUS_ORDER[(STATUS_ORDER.indexOf(t.status || "todo") + 1) % 3]; store.put("tasks", t.id, {status: next}); }
  if (act === "del" && confirm(`¿Eliminar “${t.title}”?`)) store.remove("tasks", t.id);
});
$("tasks").addEventListener("change", e => {
  const f = e.target.dataset.f; const row = e.target.closest(".task"); if (!f || !row || !store) return;
  const t = tasks.find(x => x.id === row.dataset.id); if (!t) return;
  const v = e.target.value.trim();
  if (f === "title" && !v) { e.target.value = t.title; return; }
  if ((t[f] || "") !== v) store.put("tasks", t.id, {[f]: v});
});
function addIdea(){
  const text = $("ideaText").value.trim(); if (!text || !store) return;
  const raw = $("ideaLink").value.trim();
  const link = raw ? safeUrl(/^https?:\/\//i.test(raw) ? raw : "https://" + raw) : "";
  store.put("ideas", newId(), {text, link, by: $("ideaBy").value.trim(), phase: $("ideaPhase").value, date: new Date().toISOString()});
  $("ideaText").value = ""; $("ideaLink").value = ""; $("ideaText").focus();
}
$("ideaBtn").addEventListener("click", addIdea);
$("ideaText").addEventListener("keydown", e => { if (e.key === "Enter") addIdea(); });
$("ideas").addEventListener("click", e => {
  const card = e.target.closest(".idea"); if (!card || !store) return;
  const i = ideas.find(x => x.id === card.dataset.id); if (!i) return;
  if (e.target.dataset.act === "delidea" && confirm("¿Eliminar esta idea?")) store.remove("ideas", i.id);
  if (e.target.dataset.act === "totask") {
    const phase = i.phase || "antes";
    const order = Math.max(0, ...tasks.filter(t => t.phase === phase).map(t => t.order || 0)) + 1;
    store.put("tasks", newId(), {title: i.text, phase, priority: "importante", owner: i.by || "", due: "", status: "todo", notes: i.link || "", order});
    e.target.textContent = "Agregada a tareas"; e.target.disabled = true;
  }
});
$("done").addEventListener("click", e => {
  if (e.target.dataset.act !== "reopen" || !store) return;
  store.put("tasks", e.target.closest(".done-item").dataset.id, {status: "todo"});
});
$("log").addEventListener("click", e => {
  if (e.target.dataset.act !== "dellog" || !store) return;
  const id = e.target.closest(".entry").dataset.id;
  if (confirm("¿Eliminar esta nota?")) store.remove("log", id);
});

renderAll();
init();
</script>
</body>
</html>
